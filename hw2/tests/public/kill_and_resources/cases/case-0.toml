# Killing a leaf leaves its parent serving.
command_timeout_ms = 5000
strict_cleanup = true
steps = '''
create main a
create a b
store a k v
fetch a k
wait
kill b
fetch a k
'''

[limits]
processes = { soft = 7, hard = 14 }
open_fds = { soft = 48, hard = 96 }
memory_kb = { soft = 65536, hard = 131072 }
cpu_seconds = { soft = 5, hard = 10 }
