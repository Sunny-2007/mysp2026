# Update switches consultants; a reseed changes answers at the same path.
command_timeout_ms = 5000
steps = '''
create main a
fetch a k
wait
update other
update !missing
fetch main k
wait
fetch a k
wait
reseed other
fetch a k
'''

[limits]
processes = { soft = 6, hard = 12 }
open_fds = { soft = 32, hard = 64 }
memory_kb = { soft = 65536, hard = 131072 }
cpu_seconds = { soft = 5, hard = 10 }

[consultants.other]
value_len = 40
